# GPUs for ML / AI: RTX 5090 (32 GB), RTX A6000 (48 GB), RTX 6000 Ada (48 GB),
# RTX PRO 6000 Blackwell (96 GB). Not the 2018 Quadro RTX 6000 (24 GB).
#
# One target per card: new prices run from ~CHF 4,500 to ~CHF 11,000+, so a
# pooled "cheapest" bar would be set by 5090s, and a PRO 6000 30% under its
# own market would never reach you.
#
# Prices below were set from real listings on 2026-09-28 (tutti, kleinanzeigen),
# not from memory: on the previous GPU hunt the guesses were 2x too low.
#
# Title only: GPU descriptions casually mention other cards ("almost as fast
# as a 5090") and other hardware ("was in my PC"), which would otherwise fire
# the model pattern and the excludes alike.

[defaults]
match_scope = "title"
price_policy = "cheapest"
context = ["rtx", "geforce", "nvidia", "grafikkarte", "gpu", "graphics card", "carte graphique",
           "zotac", "palit", "gainward", "asus", "msi", "gigabyte", "aorus", "evga", "inno3d",
           "pny", "founders", "leadtek"]
exclude = [
    # A lesser card that names a hunted one in passing: "RTX 5080 … nicht 5090".
    "\\b(?:3050|3060|3070|3080|3090|4060|4070|4080|4090|5060|5070|5080)\\b",
    # Laptops. Not "Max-Q": on the PRO 6000 that is the 300 W desktop edition.
    "laptop|notebook|\\bmobile\\b|zephyrus|\\bscar\\b|razer blade|legion|alienware|\\bxmg\\b|predator|helios",
    # Whole machines. Not "workstation": pro cards are *sold* as "Workstation
    # Edition". Machines give themselves away by a CPU, RAM, storage or screen.
    "\\bpc\\b|rechner|computer|komplett|\\bsystem\\b|tower|desktop|\\bomen\\b|\\bserver\\b",
    "\\bram\\b|\\bddr[45]\\b|\\bssd\\b|\\bi[3579]-\\d|ultra [579]\\b|ryzen|threadripper|xeon|epyc|\\d+\\s*kern|\\d{2}[\"”]",
    # The price is for a part, or for nothing.
    "nur (?:der )?karton|leerkarton|ohne grafikkarte|nur (?:die )?(?:ovp|verpackung)|box only|empty box",
    "vends (?:ma |la |une )?bo(?:î|i)te|bo(?:î|i)te (?:seule|vide|originale|d'origine)|scatola|\\bcaja\\b",
    "wasserk(?:ü|ue)hler|waterblock|water block|backplate|\\bek\\b|quantum vector|alphacool|bykski",
    "zubeh(?:ö|oe)r|accessor|nvlink|bridge",
    "l(?:ü|ue)fter|\\bfans?\\b|halterung|st(?:ü|ue)tze|bracket|riser|netzteil",
    # Parts sell as "<part> für RTX 5090". A card listed *with* its adapter or
    # its box ("inkl. Adapter", "mit Originalkarton") is still a card.
    "(?:f(?:ü|ue)r|for|kompatibel|compatible)\\s+(?:\\w+\\s+){0,2}(?:rtx\\s*)?(?:5090|a?6000)",
]

[[targets]]
key = "gpu-pro-6000"
label = "RTX PRO 6000 Blackwell (96 GB)"
queries = ["rtx pro 6000", "rtx 6000 blackwell"]
patterns = ["\\bpro\\s*6000\\b", "\\b6000\\s*blackwell", "blackwell.{0,30}\\b6000\\b"]
# Seen: EUR 11,000-15,000 (CHF ~11,200-15,200 landed).
fallback_max = 11500
min_plausible = 7000

[[targets]]
key = "gpu-6000-ada"
label = "RTX 6000 Ada (48 GB)"
queries = ["rtx 6000 ada"]
# A plain "RTX 6000" with 48 GB can only be the Ada; the 24 GB one is the 2018 Quadro.
patterns = ["\\b6000\\s*ada\\b", "\\bada\\s*(?:generation\\s*)?6000\\b", "\\brtx\\s*6000\\b.{0,25}\\b48\\s*gb"]
# Seen: EUR 6,200-8,500 new (CHF ~6,300-8,600 landed).
fallback_max = 6500
min_plausible = 4000

[[targets]]
key = "gpu-a6000"
label = "RTX A6000 (48 GB)"
queries = ["rtx a6000"]
patterns = ["\\ba\\s?6000\\b"]
# Seen: one genuine card, EUR 4,999 boxed first-owner (CHF ~5,080 landed).
# Used A6000s usually go lower; calibration will say.
fallback_max = 4500
min_plausible = 2500

[[targets]]
key = "gpu-5090"
label = "RTX 5090 (32 GB)"
queries = ["rtx 5090"]
patterns = ["\\b5090\\b"]
# Seen: CHF 4,200-6,900 (CH); EUR 5,000-5,900 (DE, CHF ~5,080-6,000 landed).
fallback_max = 4500
min_plausible = 3000

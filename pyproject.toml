[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dealhunt"
version = "0.1.0"
description = "Watch second-hand marketplaces for good-value items, deterministically."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Chrome TLS impersonation: needed by Cloudflare- or eBay-protected sources.
impersonation = ["curl_cffi>=0.13"]
# A headless browser: needed by sources that render listings in JavaScript.
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0"]
all = ["dealhunt[impersonation,browser,dev]"]

[project.scripts]
dealhunt = "dealhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
